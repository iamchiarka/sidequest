name: Build API image

on:
  push:
    branches: [main]
    paths: ["api/**"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}

      # Deploys the image that was just built to Dokku via `git:from-image`,
      # so the production box only ever runs a container — it never runs
      # `composer install` / builds anything itself (see prior discussion on
      # avoiding Dokku build-time RAM spikes).
      #
      # Disabled until the Hetzner box + Dokku app exist and these repo
      # secrets are set: DOKKU_HOST, DOKKU_SSH_KEY (a deploy key authorized
      # on the Dokku user), DOKKU_APP_NAME.
      # - name: Deploy via Dokku
      #   run: |
      #     mkdir -p ~/.ssh
      #     echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/deploy_key
      #     chmod 600 ~/.ssh/deploy_key
      #     ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
      #       dokku@${{ secrets.DOKKU_HOST }} \
      #       git:from-image "${{ secrets.DOKKU_APP_NAME }}" \
      #       ghcr.io/${{ github.repository }}/api:${{ github.sha }}
